<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sucção &amp; recalque</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath d='M1 5h14M1 11h14' stroke='%2316181d' stroke-width='1.4'/%3E%3Cpath d='M0 8h16' stroke='%23c0392b' stroke-width='1' stroke-dasharray='3 1.5 1 1.5'/%3E%3C/svg%3E">
<!-- o CSS do desenho vem do motor, por /comando {"nome":"estilo"}. Duas
     folhas de estilo divergiriam no primeiro ajuste, e o traço é do desenho -->
<style id="desenho"></style>
<link rel="stylesheet" href="estilo.css">
</head>
<body>
<header>
  <h1>Sucção &amp; recalque</h1>
  <div class="barra">
    <label>linha
      <select id="bitola">
        <option>3</option><option>4</option><option>6</option>
        <option selected>8</option><option>10</option><option>12</option>
        <option>14</option>
      </select>"
    </label>
    <button id="succao">montar sucção</button>
    <span class="separa"></span>
    <!-- a pose da linha na folha: girar é do conjunto, não de uma peça -->
    <button id="girar_esq" title="girar a linha 90° anti-horário">⟲</button>
    <button id="girar_dir" title="girar a linha 90° horário">⟳</button>
    <button id="espelhar_linha" title="espelhar a linha inteira">⇅</button>
    <span class="separa"></span>
    <!-- o mesmo desenho, três leituras. Só a folha de estilo muda -->
    <div class="modos" id="modos">
      <button data-modo-desenho="traco" title="desenho de projeto">traço</button>
      <button data-modo-desenho="pb" title="tudo preto, para plotar">P&amp;B</button>
      <button data-modo-desenho="metal" title="corpo metalizado">metal</button>
    </div>
    <span class="vazio"></span>
    <button id="desfazer" disabled>desfazer</button>
    <button id="refazer" disabled>refazer</button>
    <span class="separa"></span>
    <button data-exportar="dxf">DXF</button>
    <button data-exportar="xlsx">planilha</button>
    <button data-exportar="svg">SVG</button>
  </div>
</header>

<main>
  <section class="desenho">
    <!-- o palco: o motor desenha em milímetro real e já escalado para caber.
         O zoom e o pan são da TELA - uma transformação no palco, sem pedir
         nada ao motor. Por isso o traço não engorda: vector-effect faz a
         espessura ser em pixel, e ampliar mostra mais peça, não linha mais
         gorda -->
    <div id="vista" class="vista">
      <div id="palco" class="palco"><p class="nada">Monte uma sucção para começar.</p></div>
      <div class="zoom">
        <button id="menos" title="afastar (−)">−</button>
        <button id="zoom_texto" title="voltar ao enquadramento (0)">100%</button>
        <button id="mais" title="aproximar (+)">+</button>
      </div>
    </div>
    <p id="recado" class="recado" hidden></p>
    <p id="previsao" class="previsao" hidden></p>
    <p class="dica">roda do mouse amplia · arrastar o fundo move a folha ·
      arrastar uma peça a reposiciona na sequência</p>
  </section>

  <aside>
    <div class="painel" id="painel" hidden>
      <h2 id="painel_nome">—</h2>
      <p class="sap" id="painel_sap"></p>
      <label>comprimento
        <input type="number" id="comprimento" step="10" min="0">
        <span>mm</span>
      </label>
      <label>cota de
        <select id="fonte"></select>
      </label>
      <div class="acoes">
        <button id="subir">◂ mover</button>
        <button id="descer">mover ▸</button>
        <button id="espelhar" title="virar a peça de cabeça para baixo">⇅ espelhar</button>
      </div>
      <div class="acoes">
        <button id="trocar">trocar peça…</button>
        <button id="remover" class="perigo">remover</button>
      </div>
    </div>

    <div class="acrescentar">
      <h2 id="titulo_candidatos">acrescentar</h2>
      <div class="modo" id="modo" hidden>
        <button data-modo="inserir" class="ligado">inserir depois</button>
        <button data-modo="substituir">substituir</button>
      </div>
      <label>família
        <select id="familia"></select>
      </label>
      <div id="candidatos" class="candidatos"></div>
    </div>

    <h2>lista de materiais</h2>
    <table id="lista"><tbody></tbody></table>

    <div id="avisos" class="avisos"></div>
  </aside>
</main>

<script src="app.js"></script>
</body>
</html>
